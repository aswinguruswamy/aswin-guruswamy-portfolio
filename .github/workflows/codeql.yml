# EXPLAIN: CodeQL (AGP-15 AC6). GitHub scans the JavaScript and TypeScript for security problems
# on each pull request, on main, and once a week. Results show in the repo under Security > Code scanning.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
permissions: {}   # P-CI-5: per job
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to upload the scan results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3