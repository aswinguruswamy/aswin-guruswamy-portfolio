# EXPLAIN: CI. On every pull request a GitHub robot builds the page and runs tests/check.mjs (3 browsers)
# and tests/quality.mjs (axe-core and Lighthouse: NFR-01, NFR-02, NFR-10).
# Branch protection blocks the merge when this fails.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]   # NFR-04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The browser install hung for 18+ min on GitHub's machines (18 Nov, twice). Each try stops after 5 min; 3 tries.
      - run: for i in 1 2 3; do timeout 300 npx playwright install --with-deps ${{ matrix.browser }} && exit 0; echo "install try $i failed or timed out"; done; exit 1
        timeout-minutes: 16
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
  quality:
    # EXPLAIN: speed and access gate. axe on every page; Lighthouse mobile on the main page (median of 3 runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: for i in 1 2 3; do timeout 300 npx playwright install --with-deps chromium && exit 0; echo "install try $i failed or timed out"; done; exit 1
        timeout-minutes: 16
      - run: npm run test:quality
      - run: npm run test:content   # NFR-09 v1: a wrong edit in src/content stops the build
      - run: npm run test:licences  # AGP-15 AC7: open licences only
      - run: pip install pypdf==6.17.0 && python3 scripts/check-resume.py   # D51 v0: no email, phone, photo; Amazon title D6 v1
