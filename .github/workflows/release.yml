# Release workflow (Test and Release Plan, step 5).
# What this code does: when a merge to main changes the VERSION file,
# GitHub makes the tag v<VERSION> and a GitHub release for it.
# Why: the Claude session cannot push tags; GitHub's own runner can.
name: release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and check the version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must look like 1.0.0, found '$VERSION'" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if the tag already exists
        id: exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.v.outputs.tag }} exists. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make the tag and the release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          NOTES_ARGS=(--generate-notes)
          if [ -f RELEASE_NOTES.md ]; then NOTES_ARGS=(--notes-file RELEASE_NOTES.md); fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" "${NOTES_ARGS[@]}"
